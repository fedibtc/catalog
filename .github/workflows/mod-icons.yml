name: Mod icons

on:
    schedule:
        - cron: "0 9 * * 1"
    workflow_dispatch:

jobs:
    icons:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            issues: write

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - uses: cachix/install-nix-action@v30
              with:
                  nix_path: nixpkgs=channel:nixos-25.05

            - name: Check every mod icon against production
              id: icons
              run: nix develop -c ./scripts/check-mod-icons.sh

            - name: Report the broken ones
              if: failure() && steps.icons.outcome == 'failure'
              run: ./scripts/report-broken-mod-icons.sh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
